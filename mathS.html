:root{--bg:#0f172a;--panel:#111c2f;--card:#1b2638;--card2:#223047;--line:#2c3b52;--tx:#e6edf5;--tx2:#9aabbf;--acc:#14b8a6;--acc2:#38bdf8;--warn:#f59e0b;--bad:#ef4444;--good:#22c55e;--plotbg:#0b1222;--grid:#1e2a3d;--axis:#5b6b80;color-scheme:dark}
:root[data-theme="light"]{--bg:#f3f6f9;--panel:#ffffff;--card:#ffffff;--card2:#f1f5f9;--line:#d5dde6;--tx:#152233;--tx2:#55657a;--acc:#0d9488;--acc2:#0284c7;--plotbg:#ffffff;--grid:#e8edf2;--axis:#7d8a9a;color-scheme:light}
html.sk{--bg:#f6f0e2;--panel:#fbf6ea;--card:#fffdf7;--card2:#fbf3df;--line:#3b3833;--tx:#2b2b2b;--tx2:#57524a;--acc:#0f766e;--acc2:#1d4ed8;--plotbg:#fffdf7;--grid:#e9e1cc;--axis:#57524a;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font:15px/1.6 system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;display:flex;overflow:hidden}
html.sk body{font-family:'KSkHand','Malgun Gothic',sans-serif;background-image:linear-gradient(rgba(15,118,110,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(15,118,110,.07) 1px,transparent 1px);background-size:24px 24px}
button,select,input{font:inherit;color:inherit}
aside{width:290px;flex:0 0 290px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:20}
.brand{padding:16px 16px 10px;border-bottom:1px solid var(--line)}
.brand h1{margin:0;font-size:19px;line-height:1.25}.brand h1 b{color:var(--acc)}
.brand small{display:block;color:var(--tx2);font-size:12px;margin-top:2px}
.tools{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.tools button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 9px;font-size:12px;cursor:pointer}
.tools button:hover{border-color:var(--acc)}
#q{width:100%;margin-top:10px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);outline:none}
#q:focus{border-color:var(--acc)}
.prog{margin-top:8px;font-size:12px;color:var(--tx2)}.prog i{display:block;height:5px;border-radius:3px;background:var(--line);margin-top:3px;overflow:hidden}.prog i b{display:block;height:100%;background:var(--acc);width:0}
nav{flex:1;overflow:auto;padding:6px 8px 20px}
.cat{font-size:11.5px;font-weight:800;color:var(--tx2);margin:14px 6px 4px;letter-spacing:.5px}
.cat span{font-weight:500;opacity:.8}
.nv{display:flex;align-items:center;gap:6px;width:100%;text-align:left;border:0;background:none;padding:6px 9px;border-radius:8px;cursor:pointer;color:var(--tx2);font-size:13.5px}
.nv:hover{background:var(--card2);color:var(--tx)}
.nv.on{background:var(--acc);color:#04211d;font-weight:700}
html.sk .nv.on{color:#fbf8f0}
.nv .nw{margin-left:auto;font-size:10px;padding:0 5px;border-radius:5px;background:rgba(245,158,11,.18);color:var(--warn);font-weight:700}
.nv .ck{width:14px;flex:0 0 14px;color:var(--acc);font-size:12px}

  init(ui) {

{

  practice: [{ q: '반지름 10 cm 바퀴가 30° 돌았을 때 테두리 점의 높이(y)는?', a: '10 × sin 30° = 10 × 0.5 = <b>5 cm</b>' }, { q: '60 Hz 교류의 한 주기는 몇 ms?', a: '1/60 s ≈ <b>16.7 ms</b>' }, { q: '실효값 220 V 교류의 최댓값은?', a: '220 × √2 ≈ <b>311 V</b>' }],

    const [L, Rr] = ui.row(); const p = ui.canvas(300, L), q = ui.canvas(300, Rr), o = ui.out(); let t = 0;
    const draw = () => { const { A, f, ph } = ui.v; const w = 2 * Math.PI * f, phi = ph * Math.PI / 180; const th = w * t + phi; const x = A * Math.cos(th), y = A * Math.sin(th);
      p.draw({ xr: [-2.2, 2.2], yr: [-2.2, 2.2], equal: true, items: [{ type: 'circle', cx: 0, cy: 0, r: A, color: css('--axis'), w: 1 }, { type: 'line', pts: [[0, 0], [x, y]], color: COL.a, w: 2.5 }, { type: 'line', pts: [[x, 0], [x, y]], color: COL.c, w: 2.5 }, { type: 'line', pts: [[0, 0], [x, 0]], color: COL.d, w: 2.5 }, { type: 'pts', pts: [[x, y]], color: COL.a, r: 6 }, { type: 'text', x: x, y: y / 2, text: ' sin', color: COL.c, bold: true }, { type: 'text', x: x / 2, y: -0.1, text: 'cos', color: COL.d, bold: true, base: 'top', align: 'center' }], title: `θ = ${fmt(((th * 180 / Math.PI) % 360 + 360) % 360, 0)}°` });

{
  id: 'triangle', isNew: true, title: '사인법칙 · 코사인법칙', en: 'Laws of Sines & Cosines', grade: '고 수학Ⅰ', tags: ['삼각형', '측량', '링크'],

  apps: '링크 기구(크랭크 · 로봇 2관절)의 각도, 트러스 부재 길이, GPS · 측량의 삼각측량, 역기구학.',
  formula: F.line(`${F.fr(F.v('a'), 'sin ' + F.v('A'))} = ${F.fr(F.v('b'), 'sin ' + F.v('B'))} = ${F.fr(F.v('c'), 'sin ' + F.v('C'))} <small>(사인법칙)</small>`, `${F.v('a')}<sup>2</sup> = ${F.v('b')}<sup>2</sup> + ${F.v('c')}<sup>2</sup> − 2${F.v('b')}${F.v('c')} cos ${F.v('A')} <small>(코사인법칙)</small>`),
  concept: ['두 변과 그 사이 각을 알면 → 코사인법칙으로 세 번째 변.', '세 변을 알면 → 코사인법칙을 거꾸로 써서 각: cos A = (b² + c² − a²)/(2bc).', '한 변과 두 각을 알면 → 사인법칙.', 'A = 90° 이면 cos A = 0 → 피타고라스 정리가 됩니다. 코사인법칙은 피타고라스의 확장입니다.'],
  warn: '사인법칙으로 각을 구할 때는 sin 값이 같은 두 각(θ, 180° − θ)이 있어 답이 둘일 수 있습니다.',
  practice: [{ q: 'b = 5, c = 8, A = 60° 일 때 a 는?', a: 'a² = 25 + 64 − 2·5·8·0.5 = 49 → <b>a = 7</b>' }, { q: 'a = 10, A = 30°, B = 45° 일 때 b 는?', a: 'b = 10 × sin 45° / sin 30° ≈ <b>14.14</b>' }, { q: '로봇 2관절 L₁ = L₂ = 1 m, 손끝이 원점에서 1.5 m 떨어지려면 팔꿈치 각(두 링크 사이 각)은?', a: '1.5² = 1 + 1 − 2cos C → cos C = −0.125 → <b>C ≈ 97.2°</b>' }],
  init(ui) {

      const PA = [0, 0], PB = [c, 0], PC = [b * Math.cos(Ar), b * Math.sin(Ar)]; const xs = [0, c, PC[0]], ys = [0, PC[1]];
      p.draw({ xr: [Math.min(...xs) - 1, Math.max(...xs) + 1], yr: [-1, Math.max(...ys) + 1], equal: true, grid: false, axes: false, items: [{ type: 'line', pts: [PA, PB, PC], closed: true, fill: true, alpha: .1, w: 2.5 }, { type: 'text', x: c / 2, y: 0, text: `c = ${fmt(c, 1)}`, base: 'top', align: 'center', dy: 3 }, { type: 'text', x: PC[0] / 2, y: PC[1] / 2, text: `b = ${fmt(b, 1)} `, align: 'right' }, { type: 'text', x: (c + PC[0]) / 2, y: PC[1] / 2, text: ` a = ${fmt(a, 2)}`, color: COL.c, bold: true }, { type: 'text', x: 0, y: 0, text: `A ${A}°`, align: 'right', dx: -4, color: COL.b }, { type: 'text', x: c, y: 0, text: ` B ${fmt(B, 1)}°`, color: COL.b }, { type: 'text', x: PC[0], y: PC[1], text: `C ${fmt(C, 1)}°`, align: 'center', dy: -4, color: COL.b }] });
      o.set([['a (코사인법칙)', fmt(a, 3)], ['B', fmt(B, 2) + '°'], ['C', fmt(C, 2) + '°'], ['a / sin A', fmt(a / Math.sin(Ar), 3)], ['b / sin B', fmt(b / Math.sin(B * Math.PI / 180), 3)], ['넓이 ½bc sin A', fmt(0.5 * b * c * Math.sin(Ar), 3)]]); };
    ui.note('a/sinA 와 b/sinB 가 항상 같은 것(사인법칙)을 확인해 보세요.'); ui.fire();
  }
},
{

  history: '존 네이피어(1614)는 천문학자들의 엄청난 곱셈을 덧셈으로 바꾸려고 로그를 만들었습니다. 라플라스는 "로그가 천문학자의 수명을 두 배로 늘렸다"고 했습니다. 계산자(slide rule)도 로그 눈금입니다.',

  apps: '소리 · 신호 크기(dB), 필터 주파수 응답(보드 선도), 지진 규모, pH, 2진수 비트 수(log₂), 반도체 · 컴퓨터 성능 성장.',
  formula: F.line(`${F.v('b')}<sup>${F.v('x')}</sup> = ${F.v('y')} &nbsp;⟺&nbsp; ${F.v('x')} = log<sub>${F.v('b')}</sub> ${F.v('y')}, &nbsp; log(${F.v('M')}${F.v('N')}) = log ${F.v('M')} + log ${F.v('N')}`, `전력 비 dB = 10 log<sub>10</sub>${F.fr(F.v('P') + '<sub>2</sub>', F.v('P') + '<sub>1</sub>')}, &nbsp; 전압 비 dB = 20 log<sub>10</sub>${F.fr(F.v('V') + '<sub>2</sub>', F.v('V') + '<sub>1</sub>')}`),
  concept: ['로그는 "몇 번 곱했는가"를 묻습니다: log₁₀ 1000 = 3 (10을 3번 곱함).', '지수함수와 로그함수는 y = x 에 대해 대칭인 거울 관계(역함수)입니다.', '전력은 전압의 제곱에 비례하므로 전압 dB 는 20 log, 전력 dB 는 10 log.', '+3 dB ≈ 전력 2배, +10 dB = 10배, −20 dB = 전압 1/10.'],

  practice: [{ q: '전력이 100배가 되면 몇 dB 인가요?', a: '10 log₁₀ 100 = <b>20 dB</b>' }, { q: '전압이 10배가 되면 몇 dB 인가요?', a: '20 log₁₀ 10 = <b>20 dB</b> (전력으로는 100배)' }, { q: '0~1023 을 나타내려면 몇 비트가 필요한가요?', a: '2¹⁰ = 1024 → log₂ 1024 = <b>10 비트</b>' }],
  init(ui) {
    ui.slider('b', '밑 b', 1.2, 10, 0.1, 2).slider('x', 'x 값', -2, 4, 0.1, 2).slider('r', '전력 비 P₂/P₁ (로그)', -3, 3, 0.1, 2, v => fmt(Math.pow(10, v), 3) + '배');

    ui.onChange = () => { const { b, x, r } = ui.v; const y = Math.pow(b, x); const lg = (v) => Math.log(v) / Math.log(b);

      const ratio = Math.pow(10, r); const dB = 10 * r; q.draw({ xr: [-3, 3], yr: [-35, 35], xlabel: 'log₁₀(비)', ylabel: 'dB', xtick: v => '10^' + Math.round(v), items: [{ type: 'fn', f: t => 10 * t, color: COL.d }, { type: 'fn', f: t => 20 * t, color: COL.e, dash: true }, { type: 'pts', pts: [[r, dB]], color: COL.d, r: 6 }], title: '10log(전력비) — 실선 · 20log(전압비) — 점선' });
      o.set([[`${fmt(b, 1)}^${fmt(x, 1)}`, fmt(y, 4)], [`log_${fmt(b, 1)} ${fmt(y, 3)}`, fmt(x, 2)], ['전력 비', fmt(ratio, 4) + '배'], ['데시벨', fmt(dB, 1) + ' dB', dB >= 0 ? 'g' : 'w'], ['같은 dB 의 전압 비', fmt(Math.sqrt(ratio), 4) + '배']]); };

  }

{
  id: 'natlog', title: '자연상수 e 와 지수 성장 · 감쇠', en: 'Euler\'s Number e', grade: '고 미적분', tags: ['e', '복리', '시정수'],
  history: '야코프 베르누이(1683)는 "이자를 1년에 한 번이 아니라 무한히 잘게 나눠 붙이면 얼마가 될까?"를 연구하다 2.718… 이라는 수를 만났습니다. 오일러가 이 수에 e 라는 이름을 붙였습니다.',
  purpose: 'eˣ 는 <b>미분해도 자기 자신</b>인 유일한 지수함수입니다. "변화량이 지금 양에 비례"하는 모든 현상(성장 · 감쇠)을 자연스럽게 나타냅니다.',
  apps: 'RC 회로 충방전(시정수 τ), 모터 속도 상승 곡선, 방사능 붕괴, 냉각(뉴턴 냉각 법칙), 제어계 과도 응답.',
  formula: F.line(`${F.v('e')} = ${F.lim(F.v('n') + '→∞')} (1 + ${F.fr('1', F.v('n'))})<sup>${F.v('n')}</sup> ≈ 2.71828…`, `${F.fr(F.v('d'), F.v('dx'))} ${F.v('e')}<sup>${F.v('x')}</sup> = ${F.v('e')}<sup>${F.v('x')}</sup>, &nbsp; 감쇠 ${F.v('y')} = ${F.v('y')}<sub>0</sub> ${F.v('e')}<sup>−${F.v('t')}/${F.v('τ')}</sup>`),
  concept: ['1년 100% 이자를 n 번 나눠 붙이면 (1 + 1/n)ⁿ. n → ∞ 이면 e배.', 'eˣ 그래프 위 어느 점에서든 접선의 기울기 = 그 점의 높이(오른쪽 그림).', 'e^(−t/τ) 는 τ 마다 약 36.8% 로 줄어듭니다. 1 − e^(−1) = 63.2% 가 "1 시정수"의 기준.', '5τ 면 99.3% → 공학에서 "거의 다 됐다"로 봅니다.'],
  warn: 'e^(−t/τ) 에서 τ 는 "반으로 줄어드는 시간"(반감기)이 아닙니다. 반감기 = τ × ln 2 ≈ 0.693τ.',
  practice: [{ q: '100% 이자를 연속 복리로 1년 붙이면 원금의 몇 배?', a: '<b>e ≈ 2.718 배</b>' }, { q: 'RC 회로에서 1τ 뒤 충전 전압은 최종값의 몇 %?', a: '1 − e⁻¹ ≈ <b>63.2 %</b>' }, { q: 'eˣ 에서 x = 2 인 점의 접선 기울기는?', a: '(eˣ)′ = eˣ → <b>e² ≈ 7.389</b>' }],
  init(ui) {
    ui.slider('n', '나누는 횟수 n', 1, 100, 1, 1).slider('x0', '접점 x₀', -2, 2, 0.1, 1);
    const [L, Rr] = ui.row(); const p = ui.canvas(280, L), q = ui.canvas(280, Rr), o = ui.out();
    ui.onChange = () => { const { n, x0 } = ui.v; const v = Math.pow(1 + 1 / n, n); const pts = []; for (let k = 1; k <= 100; k++) pts.push([k, Math.pow(1 + 1 / k, k)]);
      p.draw({ xr: [0, 100], yr: [1.9, 2.8], xlabel: 'n', items: [{ type: 'hline', y: Math.E, color: COL.c, dash: true }, { type: 'line', pts, color: COL.a, w: 1.5 }, { type: 'pts', pts: [[n, v]], color: COL.b, r: 6 }, { type: 'text', x: 98, y: Math.E, text: 'e = 2.71828…', align: 'right', color: COL.c }], title: '(1 + 1/n)ⁿ 이 e 로 다가감' });
      const y0 = Math.exp(x0); q.draw({ xr: [-2.5, 2.5], yr: [-1, 9], items: [{ type: 'fn', f: Math.exp }, { type: 'fn', f: x => y0 + y0 * (x - x0), color: COL.b, dash: true }, { type: 'pts', pts: [[x0, y0]], color: COL.c }, { type: 'line', pts: [[x0, 0], [x0, y0]], color: COL.c, dash: [3, 3], w: 1 }], title: `높이 = 기울기 = ${fmt(y0, 3)}` });
      o.set([['(1 + 1/n)ⁿ', fmt(v, 5)], ['e 와의 차이', fmt(Math.E - v, 5)], ['e^x₀ (높이)', fmt(y0, 4)], ['접선 기울기', fmt(y0, 4)]]); };
    ui.fire();
  }
},
{
  id: 'seq', isNew: true, title: '수열과 급수', en: 'Sequences & Series', grade: '고 수학Ⅰ · 미적분', tags: ['등차', '등비', '무한급수'],
  history: '어린 가우스는 1부터 100까지의 합을 (1 + 100) × 50 = 5050 으로 순식간에 구했다고 전해집니다. 제논의 역설("아킬레스는 거북을 따라잡을 수 없다")은 무한히 많은 수를 더해도 유한한 값이 될 수 있음을 생각하게 했습니다.',
  purpose: '규칙을 따라 늘어선 수와 그 합을 다룹니다. 등비급수는 비율 |r| < 1 이면 무한히 더해도 일정한 값에 수렴합니다.',
  apps: '감가상각 · 할부 계산, 디지털 필터(이전 값의 일정 비율 누적), 공이 튀는 총 거리, 테일러 · 푸리에 급수의 기초.',
  formula: F.line(`등차: ${F.v('a')}<sub>${F.v('n')}</sub> = ${F.v('a')}<sub>1</sub> + (${F.v('n')} − 1)${F.v('d')}, &nbsp; ${F.v('S')}<sub>${F.v('n')}</sub> = ${F.fr(F.v('n') + '(' + F.v('a') + '<sub>1</sub> + ' + F.v('a') + '<sub>' + F.v('n') + '</sub>)', '2')}`, `등비: ${F.v('a')}<sub>${F.v('n')}</sub> = ${F.v('a')}<sub>1</sub>${F.v('r')}<sup>${F.v('n')}−1</sup>, &nbsp; ${F.v('S')}<sub>${F.v('n')}</sub> = ${F.fr(F.v('a') + '<sub>1</sub>(1 − ' + F.v('r') + '<sup>' + F.v('n') + '</sup>)', '1 − ' + F.v('r'))}, &nbsp; ${F.sum(F.v('n') + '=1', '∞')} ${F.v('a')}<sub>1</sub>${F.v('r')}<sup>${F.v('n')}−1</sup> = ${F.fr(F.v('a') + '<sub>1</sub>', '1 − ' + F.v('r'))} <small>(|r| &lt; 1)</small>`),
  concept: ['등차는 같은 수를 더해 가고(직선처럼), 등비는 같은 수를 곱해 갑니다(지수처럼).', '등차의 합 = (첫 항 + 끝 항) × 개수 / 2 — 가우스의 짝짓기.', '|r| < 1 이면 항이 점점 작아져 합이 a₁/(1 − r) 로 수렴합니다. r ≥ 1 이면 끝없이 커집니다.', '오른쪽 그래프의 선(부분합)이 점선(극한)에 가까워지는지 보세요.'],
  warn: '등비급수 공식 a₁/(1 − r) 은 |r| < 1 일 때만 쓸 수 있습니다.',
  practice: [{ q: '2, 5, 8, … 의 10번째 항과 10항까지의 합은?', a: 'a₁₀ = 2 + 9 × 3 = 29, S₁₀ = 10 × (2 + 29)/2 = <b>155</b>' }, { q: '1 + 1/2 + 1/4 + 1/8 + … 의 합은?', a: 'a₁ = 1, r = 1/2 → 1/(1 − 1/2) = <b>2</b>' }, { q: '2 m 높이에서 떨어진 공이 매번 이전 높이의 절반까지 튀어 오릅니다. 멈출 때까지 움직인 총 거리는?', a: '내려감 2 + (오르내림) 2 × (1 + 0.5 + 0.25 + …) = 2 + 2 × 2 = <b>6 m</b>' }],
  init(ui) {
    ui.select('k', '수열', [['g', '등비 (곱하기)'], ['a', '등차 (더하기)']], 'g').slider('a1', '첫 항 a₁', -5, 10, 0.5, 1).slider('d', '공차 d (등차)', -3, 3, 0.5, 3).slider('r', '공비 r (등비)', -1.2, 1.2, 0.05, 0.5).slider('n', '항 수 n', 1, 30, 1, 10);
    const [L, Rr] = ui.row(); const p = ui.canvas(280, L), q = ui.canvas(280, Rr), o = ui.out();
    ui.onChange = () => { const { k, a1, d, r, n } = ui.v; const A = [], S = []; let s = 0; for (let i = 1; i <= n; i++) { const a = k === 'a' ? a1 + (i - 1) * d : a1 * Math.pow(r, i - 1); s += a; A.push([i, a]); S.push([i, s]); }
      p.draw({ xr: [0, n + 1], yr: 'auto', y0: true, xlabel: 'n', items: [{ type: 'stem', pts: A, color: COL.a }], title: '각 항 aₙ' });
      const lim = k === 'g' && Math.abs(r) < 1 ? a1 / (1 - r) : null; q.draw({ xr: [0, n + 1], yr: 'auto', y0: true, xlabel: 'n', items: [{ type: 'line', pts: S, color: COL.b }, { type: 'pts', pts: S, color: COL.b, r: 3 }, ...(lim != null ? [{ type: 'hline', y: lim, color: COL.c, dash: true }] : [])], title: '부분합 Sₙ' + (lim != null ? ' → 극한(점선)' : '') });
      o.set([['aₙ', fmt(A[n - 1][1], 4)], ['Sₙ', fmt(s, 4)], ['무한합', k === 'a' ? (a1 === 0 && d === 0 ? '0' : '발산') : lim != null ? fmt(lim, 4) : '발산(|r| ≥ 1)', lim != null ? 'g' : 'w']]); };
    ui.fire();
  }
},
{

{
  id: 'dotcross', isNew: true, title: '내적 · 외적 — 일과 토크', en: 'Dot & Cross Products', grade: '고 기하 · 대학 1학년', tags: ['내적', '외적', '토크', '정사영'],

  practice: [{ q: '10 N 의 힘을 이동 방향과 60° 로 당겨 5 m 끌었습니다. 한 일은?', a: 'W = 10 × 5 × cos 60° = <b>25 J</b>' }, { q: '길이 0.3 m 렌치 끝을 50 N 으로 수직으로 밀면 토크는?', a: 'τ = 0.3 × 50 × sin 90° = <b>15 N·m</b>' }, { q: 'a = (1, 2), b = (4, −2) 는 수직인가요?', a: 'a·b = 4 − 4 = 0 → <b>수직</b>' }],

      p.draw({ xr: [-6.5, 6.5], yr: [-6.5, 6.5], equal: true, items: [{ type: 'line', pts: [[0, 0], a, [a[0] + b[0], a[1] + b[1]], b], closed: true, fill: cr >= 0 ? COL.f : COL.c, alpha: .15, w: 0 }, { type: 'line', pts: [[-u[0] * 7, -u[1] * 7], [u[0] * 7, u[1] * 7]], color: css('--axis'), dash: [2, 4], w: 1 }, { type: 'line', pts: [b, P], color: COL.e, dash: [3, 3], w: 1.5 }, { type: 'line', pts: [[0, 0], P], color: COL.e, w: 5 }, { type: 'arrow', from: [0, 0], to: a, color: COL.a, label: 'a' }, { type: 'arrow', from: [0, 0], to: b, color: COL.b, label: 'b' }] });

    ui.legend([[COL.e, '정사영(그림자) — 내적'], [COL.f, '넓이 — 외적(반시계 +)']]); ui.fire();

{
  id: 'matrix', title: '행렬 — 평면을 바꾸는 변환', en: 'Matrix Transformations', grade: '대학 선형대수', tags: ['회전', '확대', '전단', '행렬식'],
  history: '케일리(1858)가 연립방정식의 계수 표를 하나의 대상(행렬)으로 계산하는 방법을 만들었습니다. 오늘날 3D 그래픽 · 로봇 · 인공지능의 계산 대부분이 행렬 곱입니다.',
  purpose: '2 × 2 행렬은 평면의 모든 점을 한꺼번에 옮깁니다(회전 · 확대 · 뒤집기 · 기울이기). 행렬식은 넓이가 몇 배 되는지를 알려 줍니다.',
  apps: '로봇 좌표 변환, 게임 · CAD 그래픽의 회전 · 크기 조절, 딥러닝 가중치(GPU 행렬 곱), 응력 텐서.',
  formula: F.line(`${F.mt([[F.v("x′")], [F.v("y′")]])} = ${F.mt([[F.v('a'), F.v('b')], [F.v('c'), F.v('d')]])} ${F.mt([[F.v('x')], [F.v('y')]])}, &nbsp; det = ${F.v('ad')} − ${F.v('bc')}`, `회전 ${F.v('R')}(${F.v('θ')}) = ${F.mt([['cos ' + F.v('θ'), '−sin ' + F.v('θ')], ['sin ' + F.v('θ'), 'cos ' + F.v('θ')]])}`),
  concept: ['행렬의 첫 열은 (1, 0) 이 가는 곳, 둘째 열은 (0, 1) 이 가는 곳입니다(빨강 · 파랑 화살표).', '단위 정사각형이 평행사변형으로 바뀌고, 그 넓이가 |det|.', 'det < 0 이면 뒤집힘(거울), det = 0 이면 평면이 선으로 찌그러짐(되돌릴 수 없음).', '두 변환을 이어 하면 행렬 곱. AB ≠ BA (회전 후 늘리기 ≠ 늘린 후 회전).'],
  warn: '행렬 곱은 순서가 중요합니다. 점에 가까운(오른쪽) 행렬이 먼저 적용됩니다.',
  practice: [{ q: '90° 회전 행렬로 (1, 0) 을 옮기면?', a: 'R(90°) = [[0, −1], [1, 0]] → <b>(0, 1)</b>' }, { q: '[[2, 0], [0, 3]] 은 넓이를 몇 배로 하나요?', a: 'det = 6 → <b>6 배</b>' }, { q: 'A = [[1, 1], [0, 1]], B = [[1, 0], [1, 1]] 일 때 AB 와 BA 는 같은가요?', a: 'AB = [[2, 1], [1, 1]], BA = [[1, 1], [1, 2]] → <b>다름</b>' }],
  init(ui) {
    ui.select('pre', '예시', [['c', '직접 조절'], ['rot', '회전 θ'], ['sc', '확대'], ['sh', '전단(기울이기)'], ['ref', '반사(x축 거울)'], ['sing', '찌그러짐(det = 0)']], 'rot').slider('th', '회전 각 θ (°)', -180, 180, 5, 30).slider('a', 'a', -3, 3, 0.1, 1).slider('b', 'b', -3, 3, 0.1, 0).slider('c', 'c', -3, 3, 0.1, 0).slider('d', 'd', -3, 3, 0.1, 1);
    const p = ui.canvas(460, null, 640), o = ui.out(); let last = '';
    ui.onChange = () => { const v = ui.v; if (v.pre !== 'c' && (v.pre !== last || v.pre === 'rot')) { const t = rad(v.th); const M = { rot: [Math.cos(t), -Math.sin(t), Math.sin(t), Math.cos(t)], sc: [2, 0, 0, 1.5], sh: [1, 1, 0, 1], ref: [1, 0, 0, -1], sing: [1, 2, 0.5, 1] }[v.pre]; ['a', 'b', 'c', 'd'].forEach((k, i) => ui['set_' + k](M[i])); } last = v.pre;
      const { a, b, c, d } = ui.v; const T = (x, y) => [a * x + b * y, c * x + d * y]; const items = [];
      for (let k = -4; k <= 4; k++) { items.push({ type: 'line', pts: [T(k, -4), T(k, 4)], color: css('--grid'), w: 1 }, { type: 'line', pts: [T(-4, k), T(4, k)], color: css('--grid'), w: 1 }); }
      items.push({ type: 'line', pts: [[0, 0], [1, 0], [1, 1], [0, 1]], closed: true, color: css('--axis'), dash: true, w: 1 }, { type: 'line', pts: [T(0, 0), T(1, 0), T(1, 1), T(0, 1)], closed: true, fill: true, alpha: .3 }, { type: 'arrow', from: [0, 0], to: T(1, 0), color: COL.c, label: 'î′' }, { type: 'arrow', from: [0, 0], to: T(0, 1), color: COL.d, label: 'ĵ′' });
      const hp = [[0, 1.2], [0.6, 2], [1.2, 1.2], [1.2, 0.4], [0, 0.4]].map(q => [q[0] - 2.2, q[1] + 0.3]); items.push({ type: 'line', pts: hp, closed: true, color: COL.b, dash: true, w: 1 }, { type: 'line', pts: hp.map(q => T(q[0], q[1])), closed: true, color: COL.b, fill: true, alpha: .2, w: 2 });
      p.draw({ xr: [-4.5, 4.5], yr: [-4.5, 4.5], equal: true, grid: false, items }); const det = a * d - b * c;
      o.set([['행렬', `[[${fmt(a, 2)}, ${fmt(b, 2)}], [${fmt(c, 2)}, ${fmt(d, 2)}]]`], ['det (넓이 배율)', fmt(det, 3), det < 0 ? 'w' : Math.abs(det) < 1e-6 ? 'r' : 'g'], ['상태', Math.abs(det) < 1e-6 ? '찌그러짐 — 역행렬 없음' : det < 0 ? '뒤집힘(거울)' : '방향 유지']]); };
    ui.note('예시를 고른 뒤 a · b · c · d 를 직접 움직여도 됩니다(점선 = 바뀌기 전, 색 = 바뀐 뒤).'); ui.fire();
  }
},
{
  id: 'linsys', isNew: true, title: '가우스 소거법과 역행렬', en: 'Gaussian Elimination', grade: '대학 선형대수', tags: ['3원 연립', '첨가행렬', '역행렬'],
  history: '중국 『구장산술』의 방정(方程) 장에 이미 같은 방법이 있었고, 가우스가 소행성 궤도 계산에 쓰며 유럽에 널리 알려졌습니다. 컴퓨터가 큰 연립방정식을 푸는 기본 방법입니다.',
  purpose: '미지수가 여럿인 연립방정식을 <b>표(행렬)로 만들어 줄끼리 빼며</b> 차례로 정리해 풉니다. 손으로도, 컴퓨터로도 같은 절차입니다.',
  apps: '전기 회로망 해석(마디 · 망로 해석), 구조물 유한요소해석(FEM), 회귀 분석, 3D 위치 계산.',
  formula: F.line(`${F.v('A')}${F.v('x')} = ${F.v('b')} &nbsp;→&nbsp; [${F.v('A')} | ${F.v('b')}] → 위삼각 → 뒤에서부터 대입`, `${F.v('x')} = ${F.v('A')}<sup>−1</sup>${F.v('b')}, &nbsp; 2×2: ${F.mt([[F.v('a'), F.v('b')], [F.v('c'), F.v('d')]])}<sup>−1</sup> = ${F.fr('1', F.v('ad') + ' − ' + F.v('bc'))}${F.mt([[F.v('d'), '−' + F.v('b')], ['−' + F.v('c'), F.v('a')]])}`),
  concept: ['① 첫 줄의 첫 수(피벗)로 아래 줄들의 첫 수를 0 으로 만듭니다.', '② 둘째 줄의 둘째 수로 그 아래 줄을 0 으로 → 계단 모양(위삼각).', '③ 맨 아래 줄부터 미지수를 하나씩 구해 위로 대입합니다.', '피벗이 0 이면 줄을 바꿉니다. 모든 방법이 막히면 det = 0 (해가 하나로 정해지지 않음).'],
  warn: '한 줄에 수를 곱해 다른 줄에서 뺄 때 오른쪽(상수) 칸에도 똑같이 해야 합니다.',
  practice: [{ q: 'x + y + z = 6, 2y + 5z = −4, 2x + 5y − z = 27 을 푸세요.', a: '<b>x = 5, y = 3, z = −2</b> (위 시뮬레이션의 첫 예제와 같습니다)' }, { q: '[[2, 1], [5, 3]] 의 역행렬은?', a: 'det = 1 → <b>[[3, −1], [−5, 2]]</b>' }, { q: 'det(A) = 0 이면 Ax = b 의 해는?', a: '<b>해가 없거나 무수히 많음</b> (역행렬이 없음)' }],
  init(ui) {
    let A, step, log; const box = ui.html(), o = ui.out();
    const reset = (rnd) => { if (rnd) { const s = [1, 2, 3].map(() => Math.round(Math.random() * 10 - 5)); let M; do { M = [0, 1, 2].map(() => [0, 1, 2].map(() => Math.round(Math.random() * 8 - 4))); } while (Math.abs(det3(M)) < 1 || M[0][0] === 0); A = M.map(r => [...r, r[0] * s[0] + r[1] * s[1] + r[2] * s[2]]); } else A = [[1, 1, 1, 6], [0, 2, 5, -4], [2, 5, -1, 27]]; step = 0; log = ['시작: 첨가행렬 [A | b]']; show(); };
    const det3 = (M) => M[0][0] * (M[1][1] * M[2][2] - M[1][2] * M[2][1]) - M[0][1] * (M[1][0] * M[2][2] - M[1][2] * M[2][0]) + M[0][2] * (M[1][0] * M[2][1] - M[1][1] * M[2][0]);
    const ops = [[0, 1], [0, 2], [1, 2]];

function dft(x) { const n = x.length, re = new Float64Array(n), im = new Float64Array(n); for (let k = 0; k < n; k++) { let r = 0, i = 0; for (let t = 0; t < n; t++) { const a = -2 * Math.PI * k * t / n; r += x[t] * Math.cos(a); i += x[t] * Math.sin(a); } re[k] = r; im[k] = i; } return { re, im }; }
function idft(re, im) { const n = re.length, x = new Float64Array(n); for (let t = 0; t < n; t++) { let s = 0; for (let k = 0; k < n; k++) { const a = 2 * Math.PI * k * t / n; s += re[k] * Math.cos(a) - im[k] * Math.sin(a); } x[t] = s / n; } return x; }

    ui.slider('m', '질량 m (kg)', 0.2, 5, 0.1, 1).slider('k', '스프링 상수 k (N/m)', 5, 200, 1, 100).slider('c', '감쇠 계수 c (N·s/m)', 0, 60, 0.5, 4).slider('x0', '처음 변위 x₀ (m)', 0.1, 1, 0.05, 1);
    const p = ui.canvas(300), q = ui.canvas(130), o = ui.out(); let tt = 0, sol = [];
    const solve = () => { const { m, k, c, x0 } = ui.v; const h = 0.002, T = 5; sol = []; let y = [x0, 0]; for (let t = 0; t <= T; t += h) { sol.push([t, y[0]]); y = N.rk4((_, s) => [s[1], (-c * s[1] - k * s[0]) / m], y, t, h); } };
    const draw = () => { const { m, k, c, x0 } = ui.v; const wn = Math.sqrt(k / m), z = c / (2 * Math.sqrt(m * k)); const i = Math.min(sol.length - 1, Math.floor(tt / 0.002)); const xc = sol[i] ? sol[i][1] : 0;
      p.draw({ xr: [0, 5], yr: [-1.1 * x0, 1.1 * x0], xlabel: '시간 (s)', ylabel: '변위 x (m)', items: [...(z < 1 ? [{ type: 'fn', f: t => x0 * Math.exp(-z * wn * t), color: css('--axis'), dash: true, w: 1 }, { type: 'fn', f: t => -x0 * Math.exp(-z * wn * t), color: css('--axis'), dash: true, w: 1 }] : []), { type: 'line', pts: sol.filter((_, j) => j % 4 === 0), color: COL.a }, { type: 'vline', x: tt, color: COL.c, w: 1 }] });
      const coil = []; const top = 1.2, bot = 0.75 - xc / x0 * 0.3; for (let j = 0; j <= 24; j++) coil.push([j % 2 ? -0.15 : 0.15, top - (top - bot) * j / 24]); coil[0][0] = 0; coil[24][0] = 0;
      q.draw({ xr: [-1.6, 1.6], yr: [0, 1.3], equal: true, grid: false, axes: false, pad: { l: 8, r: 8, t: 4, b: 4 }, items: [{ type: 'line', pts: [[-0.6, 1.22], [0.6, 1.22]], color: css('--tx'), w: 4 }, { type: 'line', pts: coil, color: COL.d, w: 2 }, { type: 'bars', bars: [[-0.35, 0.35, bot, bot - 0.3]], color: COL.b, alpha: .8 }, { type: 'line', pts: [[-1, 0.6], [1, 0.6]], color: css('--axis'), dash: true, w: 1 }, { type: 'text', x: 0.45, y: 0.6, text: '평형 위치', size: 11, base: 'middle' }] });
      const kind = c === 0 ? ['비감쇠', '계속 진동', 'r'] : z < 0.98 ? ['부족감쇠', '출렁이며 줄어듦', 'w'] : z <= 1.02 ? ['임계감쇠', '가장 빨리 멈춤', 'g'] : ['과감쇠', '느리게 멈춤', ''];
      o.set([['고유진동수 ωₙ', fmt(wn, 3) + ' rad/s (' + fmt(wn / 2 / Math.PI, 3) + ' Hz)'], ['감쇠비 ζ', fmt(z, 3), kind[2]], [kind[0], kind[1], kind[2]], ['임계감쇠 c', fmt(2 * Math.sqrt(m * k), 2) + ' N·s/m']]); };
    ui.onChange = () => { solve(); tt = 0; draw(); }; solve(); ui.anim(dt => { tt += dt; if (tt > 5) tt = 0; draw(); });
  }
},
{
  id: 'laplace', title: '라플라스 변환과 극점(안정성)', en: 'Laplace Transform & Poles', grade: '대학 제어공학', tags: ['s-평면', '극점', '안정'],
  history: '라플라스(18세기)의 적분 변환을 헤비사이드(19세기 말)가 전기 회로 계산에 적극적으로 쓰면서 퍼졌습니다. 미분방정식이 s 에 대한 분수식(사칙연산)으로 바뀌는 마법 같은 도구입니다.',
  purpose: '시간 영역의 미분방정식을 s 영역의 대수식으로 바꿉니다. 전달함수 분모가 0 이 되는 점(극점)의 위치만 보고 시스템이 <b>안정한지 · 얼마나 빨리 · 출렁이며</b> 반응할지 압니다.',
  apps: '모터 · 드론 자세 제어기 설계, 크루즈 컨트롤, 아날로그 필터, 회로의 과도 응답 해석.',
  formula: F.line(`${F.v('F')}(${F.v('s')}) = ${F.int('0', '∞')}${F.v('f')}(${F.v('t')})${F.v('e')}<sup>−${F.v('st')}</sup>${F.v('dt')}, &nbsp; ℒ{${F.fr(F.v('df'), F.v('dt'))}} = ${F.v('sF')}(${F.v('s')}) − ${F.v('f')}(0)`, `ℒ{${F.v('e')}<sup>${F.v('σt')}</sup>sin ${F.v('ωt')}} = ${F.fr(F.v('ω'), '(' + F.v('s') + ' − ' + F.v('σ') + ')<sup>2</sup> + ' + F.v('ω') + '<sup>2</sup>')} &nbsp; → 극점 ${F.v('s')} = ${F.v('σ')} ± ${F.v('j')}${F.v('ω')}`),
  concept: ['극점의 실수부 σ: 음수(왼쪽)면 응답이 줄어들어 안정, 양수(오른쪽)면 커져서 불안정, 0 이면 계속 진동.', '극점의 허수부 ω: 출렁이는 빠르기. 0 이면 출렁이지 않음.', '왼쪽으로 멀수록 빨리 가라앉습니다(시정수 1/|σ|).', '제어기 설계 = 극점을 원하는 자리(충분히 왼쪽, 적당한 ω)로 옮기는 일입니다.'],
  practice: [{ q: '극점 실수부가 양수면 시스템은?', a: '응답이 시간에 따라 <b>발산 → 불안정</b>' }, { q: 'ℒ{e^(−at)} 는?', a: '<b>1/(s + a)</b> (극점 s = −a)' }, { q: '극점 −2 와 −10 중 더 빨리 가라앉는 것은?', a: '<b>−10</b> (시정수 0.1 s vs 0.5 s)' }],
  init(ui) {
    ui.slider('s', '극점 실수부 σ', -3, 1, 0.05, -0.5).slider('w', '극점 허수부 ω', 0, 8, 0.1, 4);
    const [L, Rr] = ui.row(); const p = ui.canvas(320, L), q = ui.canvas(320, Rr), o = ui.out();

    ui.onChange = () => { const { s, w } = ui.v; const st = s < -1e-9 ? ['안정 (수렴)', 'g'] : s > 1e-9 ? ['불안정 (발산)', 'r'] : ['임계 (계속 진동)', 'w'];
      p.draw({ xr: [-3.3, 1.3], yr: [-9, 9], xlabel: '실수부 σ', ylabel: 'jω', items: [{ type: 'bars', bars: [[-3.3, 0, 9, -9]], color: COL.f, alpha: .08, stroke: false }, { type: 'bars', bars: [[0, 1.3, 9, -9]], color: COL.c, alpha: .08, stroke: false }, { type: 'text', x: -3.2, y: 8.5, text: '안정 영역', color: COL.f, base: 'top' }, { type: 'text', x: 0.1, y: 8.5, text: '불안정', color: COL.c, base: 'top' }, { type: 'pts', pts: w > 0 ? [[s, w], [s, -w]] : [[s, 0]], color: COL.c, r: 7 }], title: 's-평면 — 눌러서 극점 옮기기' });
      q.draw({ xr: [0, 8], yr: [-1.6, 1.6], xlabel: '시간 t (s)', items: [...(w > 0 ? [{ type: 'fn', f: t => Math.exp(s * t), color: css('--axis'), dash: true, w: 1 }, { type: 'fn', f: t => -Math.exp(s * t), color: css('--axis'), dash: true, w: 1 }] : []), { type: 'fn', f: t => w > 0 ? Math.exp(s * t) * Math.cos(w * t) : Math.exp(s * t), color: st[1] === 'g' ? COL.a : st[1] === 'r' ? COL.c : COL.b, n: 800 }], title: '임펄스 응답 (극점이 만드는 움직임)' });
      o.set([['극점', w > 0 ? `${fmt(s, 2)} ± j${fmt(w, 2)}` : fmt(s, 2)], ['상태', st[0], st[1]], ['가라앉는 시정수', s < 0 ? fmt(-1 / s, 2) + ' s' : '—'], ['진동 주파수', fmt(w / 2 / Math.PI, 3) + ' Hz']]); };
    ui.fire();
  }

{
  id: 'ztransform', title: 'Z-변환과 디지털 필터', en: 'Z-Transform & Digital Filters', grade: '대학 디지털 신호처리', tags: ['단위원', 'IIR', '이동평균'],
  history: '1950년대 컬럼비아대의 라가치니와 자데가 샘플링 제어를 다루려고 라플라스 변환을 이산 시간용으로 바꾼 것이 Z-변환입니다. MCU 안의 모든 디지털 필터 · 제어기가 이 언어로 설계됩니다.',
  purpose: '숫자 열(샘플)로 동작하는 디지털 시스템을 분석합니다. 극점이 <b>단위원 안</b>에 있으면 안정합니다.',
  apps: '아두이노 센서 값 평활화(이동평균 · 1차 IIR), 디지털 PID, 오디오 이퀄라이저, 엔코더 속도 필터.',
  formula: F.line(`${F.v('X')}(${F.v('z')}) = ${F.sum(F.v('n') + '=0', '∞')} ${F.v('x')}[${F.v('n')}]${F.v('z')}<sup>−${F.v('n')}</sup>, &nbsp; ${F.v('z')}<sup>−1</sup> = 한 샘플 지연`, `1차 IIR: ${F.v('y')}[${F.v('n')}] = ${F.v('a')}·${F.v('y')}[${F.v('n')}−1] + (1 − ${F.v('a')})·${F.v('x')}[${F.v('n')}] &nbsp;⟹&nbsp; ${F.v('H')}(${F.v('z')}) = ${F.fr('1 − ' + F.v('a'), '1 − ' + F.v('a') + F.v('z') + '<sup>−1</sup>')}, 극점 ${F.v('z')} = ${F.v('a')}`),
  concept: ['1차 IIR(지수 이동평균)은 "이전 출력의 a 배 + 새 입력의 (1 − a) 배" — 코드 한 줄짜리 필터입니다.', 'a 가 1 에 가까울수록 부드럽지만 느리고, 0 에 가까울수록 빠르지만 잡음이 남습니다.', '극점 a 가 단위원 밖(|a| > 1)이면 출력이 발산합니다.', '이동평균은 최근 N 개의 평균 — 극점 없이 영점만 있는(FIR) 필터입니다.'],
  warn: '정수 연산 MCU 에서 a 를 소수로 쓰면 반올림 오차가 쌓입니다. 비트 시프트(a = 7/8 등)를 자주 씁니다.',
  practice: [{ q: 'Z-평면에서 안정하기 위한 극점 위치는?', a: '<b>단위원(반지름 1) 안쪽</b>' }, { q: 'y[n] = 0.9y[n−1] + 0.1x[n] 의 극점은?', a: '<b>z = 0.9</b> (안정, 꽤 부드러운 필터)' }, { q: '샘플 주기 10 ms, a = 0.9 인 필터의 대략적인 시정수는?', a: '−T/ln a = 0.01/0.105 ≈ <b>0.095 s</b>' }],
  init(ui) {
    ui.select('k', '필터', [['iir', '1차 IIR (지수 이동평균)'], ['ma', '이동평균 N']], 'iir').slider('a', '계수 a (극점)', -1.2, 1.2, 0.01, 0.8).slider('N', '이동평균 개수 N', 1, 20, 1, 5).slider('nz', '입력 잡음', 0, 1, 0.05, 0.4);
    const [L, Rr] = ui.row(); const p = ui.canvas(300, L), q = ui.canvas(300, Rr), o = ui.out(); const noise = Array.from({ length: 80 }, () => N.randn());
    ui.onChange = () => { const { k, a, N: Nn, nz } = ui.v; const x = noise.map((v, n) => (n >= 5 ? 1 : 0) + nz * v * 0.5); const y = []; let prev = 0;
      for (let n = 0; n < 80; n++) { if (k === 'iir') { prev = a * prev + (1 - a) * x[n]; y.push(prev); } else { let s = 0; for (let j = 0; j < Nn; j++) s += n - j >= 0 ? x[n - j] : 0; y.push(s / Nn); } }
      const zeros = k === 'ma' ? Array.from({ length: Nn - 1 }, (_, j) => { const t = 2 * Math.PI * (j + 1) / Nn; return [Math.cos(t), Math.sin(t)]; }) : [[0, 0]]; const poles = k === 'iir' ? [[a, 0]] : [];
      p.draw({ xr: [-1.6, 1.6], yr: [-1.6, 1.6], equal: true, xlabel: 'Re z', ylabel: 'Im z', items: [{ type: 'circle', cx: 0, cy: 0, r: 1, color: COL.f, w: 2, fill: true, alpha: .06 }, { type: 'pts', pts: zeros, color: COL.d, hollow: true, r: 5 }, ...poles.map(pp => ({ type: 'text', x: pp[0], y: pp[1], text: '✕', align: 'center', base: 'middle', size: 18, bold: true, color: Math.abs(a) >= 1 ? COL.c : COL.b }))], title: 'z-평면 (✕ 극점, ○ 영점)' });
      const yl = Math.max(2, ...y.map(Math.abs).filter(isFinite)); q.draw({ xr: [0, 80], yr: [-0.6, Math.min(yl * 1.1, 8)], xlabel: '샘플 n', items: [{ type: 'stem', pts: x.map((v, n) => [n, v]), color: css('--axis'), r: 2, w: 1 }, { type: 'line', pts: y.map((v, n) => [n, v]), color: COL.a, w: 2.5 }], title: '입력(회색 · 잡음 섞인 계단) → 출력(초록)' });

    ui.fire();
  }
},
{
  id: 'pid', isNew: true, title: 'PID 제어', en: 'PID Control', grade: '대학 제어공학 · 메카트로닉스', tags: ['P · I · D', '오버슈트', '정상상태 오차'],
  history: '미노르스키(1922)가 배의 자동 조타 장치를 연구하며 PID 제어를 수학적으로 정리했습니다. 지금도 산업 제어 루프의 90% 이상이 PID 입니다.',
  purpose: '목표값과 현재값의 차이(오차)로 조작량을 정합니다. <b>P</b>는 지금 오차, <b>I</b>는 쌓인 오차(남은 오차 없애기), <b>D</b>는 오차가 변하는 빠르기(미리 브레이크).',
  apps: '모터 속도 · 위치 제어, 온도 조절기, 드론 자세 제어, 라인트레이서, PLC 의 PID 명령, 인버터 압력 제어.',
  formula: F.line(`${F.v('u')}(${F.v('t')}) = ${F.v('K')}<sub>p</sub>${F.v('e')}(${F.v('t')}) + ${F.v('K')}<sub>i</sub>${F.int('0', F.v('t'))}${F.v('e')}(${F.v('τ')})${F.v('dτ')} + ${F.v('K')}<sub>d</sub>${F.fr(F.v('de'), F.v('dt'))}, &nbsp; ${F.v('e')} = 목표 − 현재`, `대상(플랜트): ${F.v('G')}(${F.v('s')}) = ${F.fr('1', '(0.5' + F.v('s') + ' + 1)(0.1' + F.v('s') + ' + 1)')} <small>(모터 + 센서 지연을 단순화)</small>`),
  concept: ['P 만 쓰면 목표 근처에서 조작량이 작아져 오차가 남습니다(정상상태 오차). Kp 를 키우면 줄지만 출렁입니다.', 'I 를 더하면 남은 오차가 쌓여 결국 0 이 됩니다. 너무 크면 크게 넘칩니다(오버슈트).', 'D 는 빠르게 다가갈 때 미리 줄여 출렁임을 누릅니다. 잡음에 민감합니다.', '조정 순서 예: P 를 올려 빠르게 → I 로 오차 제거 → D 로 출렁임 줄이기.'],
  warn: '실제 장치는 조작량에 한계(포화)가 있습니다. I 가 한계에 걸린 채 쌓이면 크게 넘칩니다(와인드업).',
  practice: [{ q: 'P 제어만 하면 생기는 문제는?', a: '<b>정상상태 오차</b>가 남음(Kp 가 유한하면)' }, { q: '정상상태 오차를 없애는 항은?', a: '<b>I (적분)</b>' }, { q: '오버슈트가 너무 클 때 먼저 해 볼 조치는?', a: '<b>Kd 를 늘리거나 Ki · Kp 를 줄이기</b>' }],
  init(ui) {
    ui.slider('kp', 'Kp (비례)', 0, 20, 0.1, 10).slider('ki', 'Ki (적분)', 0, 20, 0.1, 10).slider('kd', 'Kd (미분)', 0, 2, 0.01, 0).slider('umax', '조작량 한계 |u|', 2, 50, 1, 20).check('dist', '2.5 s 에 외란(부하) 넣기', false);
    const p = ui.canvas(280), q = ui.canvas(150), o = ui.out();
    ui.onChange = () => { const { kp, ki, kd, umax, dist } = ui.v; const h = 0.001, T = 5; let x1 = 0, x2 = 0, I = 0, ePrev = 1, df = 0; const Y = [], U = [];
      for (let k = 0; k * h <= T; k++) { const t = k * h; const r = 1; const e = r - x2; I += e * h; const dRaw = (e - ePrev) / h; df += (dRaw - df) * Math.min(1, h / 0.01); ePrev = e; let u = kp * e + ki * I + kd * (k ? df : 0); u = clamp(u, -umax, umax); if (Math.abs(u) >= umax && Math.sign(u) === Math.sign(e)) I -= e * h; const d = dist && t > 2.5 ? -0.5 : 0;
        const dx1 = (u + d - x1) / 0.5; x1 += dx1 * h; const dx2 = (x1 - x2) / 0.1; x2 += dx2 * h; if (k % 10 === 0) { Y.push([t, x2]); U.push([t, u]); } }
      p.draw({ xr: [0, 5], yr: [-0.1, 1.8], xlabel: '시간 (s)', ylabel: '출력', items: [{ type: 'bars', bars: [[0, 5, 1.02, 0.98]], color: COL.f, alpha: .15, stroke: false }, { type: 'hline', y: 1, color: COL.b, dash: true, w: 1.5 }, { type: 'line', pts: Y, color: COL.a, w: 2.5 }] });

{

{
  id: 'gd', isNew: true, title: '경사하강법 — AI 가 배우는 방법', en: 'Gradient Descent', grade: '대학 · AI 기초', tags: ['학습률', '손실 함수', '최적화'],
  history: '코시(1847)가 처음 제안한 방법이 150년 뒤 인공신경망 학습의 핵심이 되었습니다. 딥러닝은 수십억 개의 가중치를 이 방법으로 조금씩 고쳐 갑니다.',

  init(ui) {
    ui.select('fn', '손실 함수', [['b', 'x² + a·y² (그릇)'], ['two', '웅덩이 두 개']], 'b').slider('a', '길쭉함 a', 1, 20, 0.5, 6).slider('lr', '학습률 η', 0.005, 0.5, 0.005, 0.08).slider('k', '걸음 수', 1, 100, 1, 30);

    ui.onChange = () => { const { fn, a, lr, k } = ui.v; const f = fn === 'b' ? (x, y) => x * x + a * y * y : (x, y) => (x * x - 1) ** 2 + 0.3 * x + a * 0.2 * y * y; const g = fn === 'b' ? (x, y) => [2 * x, 2 * a * y] : (x, y) => [4 * x * (x * x - 1) + 0.3, a * 0.4 * y];

      const last = path[path.length - 1]; q.draw({ xr: [0, k], yr: 'auto', y0: true, xlabel: '걸음', ylabel: '손실 L', items: [{ type: 'line', pts: loss, color: COL.a }, { type: 'pts', pts: loss, color: COL.a, r: 2.5 }], title: '손실이 줄어드는 모습' });
